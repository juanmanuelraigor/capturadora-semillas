[build]
  publish = "public"
  functions = "netlify/functions"
  # No gastar créditos cuando el commit solo cambia las semillas (la web las lee de GitHub)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)public/data/'"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
